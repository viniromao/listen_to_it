[package]
name = "listen_to_it"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "listen_to_it"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
ratatui = "0.29"
ratatui-image = { version = "6", features = ["crossterm"] }
reqwest = { version = "0.12" }
rodio = { version = "0.19", features = ["symphonia-all"] }
rusty_ytdl = { version = "0.7.4", features = ["search"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.8.3"
tokio = { version = "1", features = ["full"] }
