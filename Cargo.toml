[package]
name = "listen_to_it"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/viniromao/listen_to_it"

[[bin]]
name = "listen_to_it"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = { version = "0.28", features = ["event-stream"] }
flate2 = "1.1.9"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
ratatui = "0.29"
ratatui-image = { version = "6", features = ["crossterm"] }
reqwest = { version = "0.12" }
rodio = { version = "0.19", features = ["symphonia-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.8.3"
tokio = { version = "1", features = ["full"] }
unicode-width = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
